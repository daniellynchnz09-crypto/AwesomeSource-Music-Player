org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# KSP 2.2.10-2.0.2 still registers its generated-source dirs via the old
# kotlin.sourceSets DSL, which AGP 9.x's built-in Kotlin support rejects by
# default. This is AGP's own documented suppression for that specific gap
# (see the error this silences, and https://developer.android.com/r/tools/built-in-kotlin) -
# revisit once a KSP release adopts the new android.sourceSets/Sources API.
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
